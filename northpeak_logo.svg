<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="peak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#3C6997"/>
    </linearGradient>
    <linearGradient id="snow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8F1F8"/>
    </linearGradient>
  </defs>
  
  <!-- Mountain peaks -->
  <polygon points="80,140 130,55 180,140" fill="url(#peak)"/>
  <polygon points="120,140 160,70 200,140" fill="#2A4F73" opacity="0.85"/>
  <polygon points="55,140 105,80 155,140" fill="#1B3A5C" opacity="0.6"/>
  
  <!-- Snow caps -->
  <polygon points="130,55 120,75 140,75" fill="url(#snow)"/>
  <polygon points="160,70 152,85 168,85" fill="url(#snow)" opacity="0.9"/>
  
  <!-- Subtle upward arrow in negative space (inventory moving to right place) -->
  <polygon points="128,95 130,88 132,95" fill="#FFB020" opacity="0.9"/>
  
  <!-- Brand name -->
  <text x="210" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#1B3A5C" letter-spacing="-0.5">NorthPeak</text>
  <text x="210" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#5A7A9A" letter-spacing="3">RETAIL</text>
  
  <!-- Tagline -->
  <text x="210" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#3C6997" letter-spacing="0.5" font-style="italic">Right stock. Right store. Right now.</text>
</svg>